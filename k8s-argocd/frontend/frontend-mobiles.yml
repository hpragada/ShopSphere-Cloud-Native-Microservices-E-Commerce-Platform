apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-mobiles
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hpragada/ShopSphere-Cloud-Native-Microservices-E-Commerce-Platform
    path: frontend/mobiles
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
