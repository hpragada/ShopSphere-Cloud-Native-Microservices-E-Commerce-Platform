
name: CI/CD for Shopping Site (Frontend + Backend)

on:
  workflow_dispatch:

  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "441130535581"
  ECR_REGISTRY: "441130535581.dkr.ecr.us-east-1.amazonaws.com"

  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"
  BACKEND_SERVICE: "backend"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Configure AWS Credentials
      # -------------------------
      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Verify AWS Credentials
      # -------------------------
      - name: 🔍 Verify AWS credentials
        run: |
          aws sts get-caller-identity

      # -------------------------
      # Login to Amazon ECR
      # -------------------------
      - name: 📦 Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

      # -------------------------
      # Build & Push Docker Images
      # -------------------------
      - name: 🛠 Build and Push Docker Images
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA}"

          echo "======================================"
          echo "AWS Region: $AWS_REGION"
          echo "ECR Registry: $ECR_REGISTRY"
          echo "Image Tag: $IMAGE_TAG"
          echo "======================================"

          # -------------------------
          # Frontend Services
          # -------------------------
          for service in $FRONTEND_SERVICES; do

            FOLDER="frontend/$service"
            REPO_NAME="shopping-site-$service"
            IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

            if [ ! -f "$FOLDER/Dockerfile" ]; then
              echo "⚠️ No Dockerfile in $FOLDER, skipping..."
              continue
            fi

            echo ""
            echo "======================================"
            echo "🚀 Building frontend: $service"
            echo "📁 Folder: $FOLDER"
            echo "📦 Repository: $REPO_NAME"
            echo "======================================"

            # Create ECR repository if it doesn't exist
            aws ecr describe-repositories \
              --repository-names "$REPO_NAME" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true

            # Build Docker image
            docker build \
              -t "$IMAGE_URI" \
              "$FOLDER"

            # Push Docker image to ECR
            docker push "$IMAGE_URI"

            # Update Kubernetes deployment
            if [ -f "$FOLDER/deployment.yml" ]; then
              sed -i "s|image:.*|image: $IMAGE_URI|g" \
                "$FOLDER/deployment.yml"
            fi

          done

          # -------------------------
          # Backend
          # -------------------------
          FOLDER="backend"
          REPO_NAME="shopping-site-backend"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo ""
          echo "======================================"
          echo "🚀 Building backend"
          echo "📁 Folder: $FOLDER"
          echo "📦 Repository: $REPO_NAME"
          echo "======================================"

          # Create backend ECR repository if it doesn't exist
          aws ecr describe-repositories \
            --repository-names "$REPO_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$REPO_NAME" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true

          # Build backend image
          docker build \
            -t "$IMAGE_URI" \
            "$FOLDER"

          # Push backend image
          docker push "$IMAGE_URI"

          # Update Kubernetes deployment
          if [ -f "$FOLDER/backend-deployment.yml" ]; then
            sed -i "s|image:.*|image: $IMAGE_URI|g" \
              "$FOLDER/backend-deployment.yml"
          fi

      # -------------------------
      # Commit Updated YAML Files
      # -------------------------
      - name: 🔄 Commit updated YAML files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add frontend/**/deployment.yml backend/backend-deployment.yml

          git commit \
            -m "🔄 Update image tags after build [skip ci]" \
            || echo "No changes"

          git push origin main || echo "Nothing to push"

